# Configuracao de producao do Backstage.
#
# Segredos vem por variavel de ambiente, do Secret backstage-postgres.
# Este arquivo so referencia os nomes, nunca os valores.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-config
  namespace: backstage
data:
  app-config.production.yaml: |
    app:
      baseUrl: https://backstage.kind.localhost

    backend:
      baseUrl: https://backstage.kind.localhost
      listen: ':7007'
      cors:
        origin: https://backstage.kind.localhost
      database:
        client: pg
        connection:
          host: ${POSTGRES_HOST}
          port: ${POSTGRES_PORT}
          user: ${POSTGRES_USER}
          password: ${POSTGRES_PASSWORD}

    auth:
      # Sem isto o app assume "development" e nao encontra o provider,
      # que esta declarado sob "production".
      environment: production
      # Login exclusivamente por GitHub. O provider guest foi removido
      # apos o fluxo OAuth ser validado em uso.
      providers:
        github:
          production:
            clientId: ${AUTH_GITHUB_CLIENT_ID}
            clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
            signIn:
              resolvers:
                # Casa o login do GitHub com a entidade User de mesmo
                # nome no catalogo. Ha um user:default/jmarcelotse.
                - resolver: usernameMatchingUserEntityName

    catalog:
      # Substitui os dados de exemplo do scaffold pelas entidades reais,
      # montadas do ConfigMap backstage-catalog.
      locations:
        - type: file
          target: /catalog/entities.yaml
          rules:
            - allow: [Component, System, Resource, User, Group, API, Domain]
